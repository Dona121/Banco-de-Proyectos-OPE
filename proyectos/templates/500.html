{% extends "base.html" %}
{% block title %}Error del servidor{% endblock %}
{% block body %}
<div class="min-h-full grid place-items-center p-6">
  <div class="text-center max-w-md">
    <p class="font-head text-6xl font-extrabold text-rojo">500</p>
    <h1 class="mt-2 font-head text-xl font-bold text-slate-800">Algo salió mal de nuestro lado</h1>
    <p class="mt-2 text-sm text-slate-500">Ocurrió un error inesperado. Intenta de nuevo en un momento; si el problema continúa, avisa al administrador.</p>
    <a href="{% url 'web:dashboard' %}" class="btn btn-primary mt-6">Volver al inicio</a>
  </div>
</div>
{% endblock %}
